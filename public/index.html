<!DOCTYPE html>
<html lang="hi">
<head>
    <meta name="google-site-verification" content="Aqv1Hre5PKUCENUSuf9X8j6zAiw29I2ceuhyyX1hs3s" />
    <meta name="google-site-verification" content="Aqv1Hre5PKUCENUSuf9X8j6zAiw29I2ceuhyyX1hs3s" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truck Wala Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        html, body { height: 100dvh; width: 100%; overflow: hidden; overscroll-behavior: none; }
        body {
            background-position: center; background-size: cover; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: space-between;
            color: white; padding: 15px; transition: background 0.5s ease;
            background-image: url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1000');
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .live-badge { background: rgba(0,0,0,0.65); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); }
        .dot { width: 8px; height: 8px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 8px #00ff66; }
        .app-title { text-align: center; font-size: 32px; font-weight: 800; text-shadow: 2px 2px 12px rgba(0,0,0,0.9); margin-top: 10px; }
        .player-card {
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px;
            padding: 18px; color: #ffffff; max-width: 420px; width: 100%; margin: 0 auto 10px auto;
        }
        .song-info { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
        .album-art { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,0.4); }
        .song-details { flex: 1; overflow: hidden; white-space: nowrap; }
        .song-details h3 { font-size: 16px; font-weight: bold; color: #ffffff; text-overflow: ellipsis; overflow: hidden; }
        .song-details p { font-size: 13px; color: #ddd; margin-top: 3px; }
        .progress-box { margin: 10px 0; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; accent-color: #ff3d00; cursor: pointer; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; margin-top: 4px; }
        .controls { display: flex; justify-content: space-around; align-items: center; margin-top: 12px; }
        .btn { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; transition: color 0.2s; }
        .btn.active { color: #ff3d00; text-shadow: 0 0 8px rgba(255, 61, 0, 0.6); }
        .btn-play { background: #ff3d00; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .btn-nav { color: white; font-size: 20px; }
    </style>

<style>
  /* Slim & Transparent B&W Glassmorphism Override */
  .player-card, .music-card, .card, [class*="player"], [class*="card"] {
    background: rgba(0, 0, 0, 0.45) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 16px !important;
    padding: 10px 14px !important;
  }
</style>


<style>
  /* Ultra-Slim Glassmorphism Override */
  .player-card, .music-card, .card, [class*="player"], [class*="card"] {
    background: rgba(0, 0, 0, 0.4) !important;
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    border-radius: 12px !important;
    padding: 4px 10px !important; /* Super Compact Padding */
    margin: 4px auto !important;
    max-width: 320px !important;
  }
  
  /* Compact Elements inside Box */
  .player-card img, [class*="player"] img, .card img {
    max-width: 45px !important;
    max-height: 45px !important;
    border-radius: 8px !important;
  }
  
  .player-card h3, .player-card p, [class*="player"] text {
    font-size: 12px !important;
    margin: 2px 0 !important;
  }
  
  /* Compact Controls */
  button, svg {
    transform: scale(0.88) !important;
  }
</style>

</head>
<body>
    <div class="header">
        <div class="live-badge"><div class="dot"></div> Live Listeners: <span id="userCount">0</span></div>
    </div>
    <div class="app-title" id="bannerTitle">ट्रक वाला</div>
    <div class="player-card">
        <div class="song-info">
            <img id="coverArt" class="album-art" src="https://i.postimg.cc/442v42s0/bobby.jpg" alt="Cover">
            <div class="song-details">
                <h3 id="songTitle">Select a Song</h3>
                <p id="songArtist">Truck Wala Mix</p>
            </div>
        </div>
        <div class="progress-box">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="controls">
            <button class="btn" id="shuffleBtn"><i class="fa-solid fa-shuffle"></i></button>
            <button class="btn btn-nav" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn btn-play" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
            <button class="btn btn-nav" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            <button class="btn" id="repeatBtn"><i class="fa-solid fa-repeat"></i></button>
        </div>
    </div>
    <audio id="audioPlayer"></audio>
    <script>
        const socket = io();
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');

        let songs = [];
        let currentIndex = 0;
        let isShuffle = false;
        let isRepeat = false;

        socket.on('userCount', count => document.getElementById('userCount').innerText = count);
        socket.on('configUpdated', cfg => updateConfig(cfg));
        socket.on('songsUpdated', updatedSongs => {
            songs = updatedSongs;
            if (songs.length > 0 && !audio.src) loadSong(0);
        });

        async function init() {
            const cfg = await (await fetch('/api/config')).json();
            updateConfig(cfg);
            songs = await (await fetch('/api/songs')).json();
            if (songs.length > 0) loadSong(0);
        }

        function updateConfig(cfg) {
            if (cfg.bannerTitle) document.getElementById('bannerTitle').innerText = cfg.bannerTitle;
            if (cfg.bgImage) document.body.style.backgroundImage = `url('${cfg.bgImage}')`;
        }

        function loadSong(index) {
            if (!songs[index]) return;
            currentIndex = index;
            const song = songs[currentIndex];
            audio.src = song.url;
            document.getElementById('songTitle').innerText = song.title;
            document.getElementById('songArtist').innerText = song.artist;
            document.getElementById('coverArt').src = song.coverArt;
        }

        playBtn.onclick = () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
            }
        };

        shuffleBtn.onclick = () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        };

        repeatBtn.onclick = () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        };

        audio.onended = () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else if (isShuffle) {
                let randomIndex = Math.floor(Math.random() * songs.length);
                loadSong(randomIndex);
                audio.play();
            } else {
                nextSong();
            }
        };

        function nextSong() {
            if (songs.length === 0) return;
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * songs.length);
            } else {
                currentIndex = (currentIndex + 1) % songs.length;
            }
            loadSong(currentIndex);
            audio.play();
            playIcon.className = 'fa-solid fa-pause';
        }

        document.getElementById('nextBtn').onclick = nextSong;

        document.getElementById('prevBtn').onclick = () => {
            if (songs.length === 0) return;
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            audio.play();
            playIcon.className = 'fa-solid fa-pause';
        };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        };

        progressBar.oninput = () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        };

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        init();
    </script>
</body>
</html>
