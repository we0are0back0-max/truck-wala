<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck-Wala Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #ff4757; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input[type="text"] { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #ff4757; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎵 Add Permanent Song</h2>
        <form id="songForm">
            <div class="form-group">
                <label>Song Title:</label>
                <input type="text" id="title" placeholder="Gaane ka naam likhein" required>
            </div>
            <div class="form-group">
                <label>Singer / Artist:</label>
                <input type="text" id="artist" placeholder="Singer ka naam" required>
            </div>
            <div class="form-group">
                <label>Audio URL (Archive.org .mp3 Link):</label>
                <input type="text" id="audioUrl" placeholder="https://archive.org/download/..." required>
            </div>
            <div class="form-group">
                <label>Cover Photo URL (ImgBB Link):</label>
                <input type="text" id="imageUrl" placeholder="https://i.ibb.co/..." required>
            </div>
            <button type="submit">Save Song to Playlist</button>
        </form>
    </div>
    <script>
        document.getElementById('songForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const artist = document.getElementById('artist').value;
            const url = document.getElementById('audioUrl').value;
            const image = document.getElementById('imageUrl').value;

            const res = await fetch('/api/add-song', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, artist, url, image })
            });
            const data = await res.json();
            if(data.success) {
                alert('Gaana successfully add ho gaya!');
                document.getElementById('songForm').reset();
            } else {
                alert('Error: ' + data.message);
            }
        });
    </script>
</body>
</html>
